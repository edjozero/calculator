<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="expression">
            <input type="text" id="expressionInput" disabled>
        </div>
        <div id="display">
            <input type="text" id="daDisplay" disabled>
        </div>
        <div id="buttons">
            <button class="allButtons clear">C</button>
            <button class="allButtons delete">del</button>
            <button class="allButtons fillers">%</button>
            <button class="allButtons operators" value="÷">÷</button>
            <button class="allButtons numbers" value="7">7</button>
            <button class="allButtons numbers" value="8">8</button>
            <button class="allButtons numbers" value="9">9</button>
            <button class="allButtons operators" value="x">x</button>
            <button class="allButtons numbers" value="4">4</button>
            <button class="allButtons numbers" value="5">5</button>
            <button class="allButtons numbers" value="6">6</button>
            <button class="allButtons operators" value="-">-</button>
            <button class="allButtons numbers" value="1">1</button>
            <button class="allButtons numbers" value="2">2</button>
            <button class="allButtons numbers" value="3">3</button>
            <button class="allButtons operators" value="+">+</button>
            <button class="allButtons fillers">$</button>
            <button class="allButtons numbers" value="0">0</button>
            <button class="allButtons decimal" value=".">.</button>
            <button class="allButtons submitMath">=</button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
